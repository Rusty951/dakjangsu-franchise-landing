<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>닭장수후라이드 공유 이미지</title>
  <style>
    @font-face { font-family: 'Black Han Sans'; src: url('/fonts/black-han-sans/BlackHanSans-Regular.ttf'); font-weight:400; }
    * { box-sizing:border-box; }
    html, body { margin:0; width:1200px; height:630px; overflow:hidden; }
    .card { position:relative; width:1200px; height:630px; background:#f7efe4; color:#241f1b; }
    .logo { position:absolute; top:54px; left:64px; width:280px; height:70px; object-fit:contain; }
    h1 { position:absolute; top:176px; left:64px; margin:0; z-index:1; font:400 74px/1.17 'Black Han Sans',sans-serif; letter-spacing:-.045em; }
    h1 span { display:block; }
    h1 em { color:#a74321; font-style:normal; }
    .note { position:absolute; left:66px; bottom:56px; margin:0; font:400 24px/1.5 'Black Han Sans',sans-serif; }
    .host { position:absolute; width:500px; height:500px; right:30px; top:100px; object-fit:contain; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/rebrand/bi-warm-ink.png" alt="닭장수후라이드" />
    <h1><span>사장님 창업비,</span><span><em>얼마나 줄일 수</em></span><span>있을까요?</span></h1>
    <p class="note">창업 지원 조건부터<br />매장 공간과 점주 이야기까지.</p>
    <img class="host" src="/rebrand/poses/hero-gesture-v2/masters/06-hold.png" alt="닭장수 캐릭터" />
  </main>
</body>
</html>
